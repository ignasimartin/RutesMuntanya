name: Build APK

# Compila l'APK de debug a cada push i el deixa disponible per descarregar.
# També, si crees una etiqueta (tag) que comenci per "v" (p. ex. v1.0),
# publica una Release amb l'APK adjunt.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # permet llançar-lo a mà des de la pestanya Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarrega el codi
        uses: actions/checkout@v4

      - name: Configura Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configura l'Android SDK
        uses: android-actions/setup-android@v3

      - name: Permisos d'execució al wrapper
        run: chmod +x ./gradlew

      - name: Compila l'APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Puja l'APK com a artefacte
        uses: actions/upload-artifact@v4
        with:
          name: RutesMuntanya-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publica Release (només en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
